<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e17"><title>RunClan</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e17;color:#f4f1ed;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}header{padding:20px 20px 12px;background:#101722}h1{font-size:35px;font-style:italic;margin:0;color:#f7f3ed;letter-spacing:-2px}h1 span,.orange{color:#f58a32}small,.muted{color:#a9aab0}.tag{color:#f58a32;font-size:12px;letter-spacing:2px}.wrap{max-width:480px;margin:auto;min-height:100dvh;padding-bottom:100px}.hero{height:250px;background:linear-gradient(0deg,#101722 0%,transparent 60%),linear-gradient(125deg,#33293b,#172b38 45%,#bd6538);display:flex;align-items:flex-end;padding:18px}.hero h2{font-size:28px;max-width:250px;text-shadow:0 2px 8px #000}.panel{background:#121923;border:1px solid #28303d;border-radius:16px;padding:16px;margin:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#1b2430;border-radius:12px;padding:15px}.big{font-size:36px;font-weight:800}.bar{height:9px;background:#29313e;border-radius:9px;overflow:hidden}.bar>div{background:linear-gradient(90deg,#eb7022,#ffb35a);height:100%}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0a0e16;border-top:1px solid #30343d;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.tabs button{width:20%;max-width:96px;background:none;border:0;color:#a5a5ac;padding:14px 2px;font-size:11px}.tabs button.active{color:#ff943b}.action{border:0;border-radius:10px;background:#f58a32;color:#17100d;padding:12px 18px;font-weight:700}.outline{background:#222a36;color:#eee;border:1px solid #394454}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.list{border-bottom:1px solid #303642;padding:13px 0}.hidden{display:none}input{width:100%;padding:12px;background:#0b1019;border:1px solid #424957;border-radius:9px;color:white;margin:5px 0 12px}.map{width:100%;height:380px;border:0;border-radius:14px;background:#192532}.notice{font-size:12px;color:#e6bd98;background:#302114;padding:10px;border-radius:8px}.screen{padding:6px 10px}h2{margin:10px 0}h3{margin:12px 0}.runner{font-size:23px}.route{padding:12px;background:#1c2530;border-radius:10px;margin:10px 0}.badge{color:#ff943b;font-size:12px}

/* RunClan visual restoration — cinematic mountain identity */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--copper:#f58a32;--ink:#090e17;--edge:#343b45}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#1b2533 0%,#090e17 65%) fixed}
h1,h2,h3,.big{font-family:'Barlow Condensed',Impact,system-ui,sans-serif;letter-spacing:.3px}
header{background:linear-gradient(180deg,#111a27,#0d141f);border-bottom:1px solid #26303b;padding:22px 22px 15px}
header h1{font-size:46px;font-weight:900;letter-spacing:-1px;line-height:.95;text-transform:uppercase}
header .tag{font-size:10px;letter-spacing:2.6px;margin-bottom:7px}
.wrap{box-shadow:0 0 80px #0007}
.hero{height:355px;position:relative;overflow:hidden;border-bottom:1px solid #60432e;background:linear-gradient(0deg,#101722 0%,#10172244 43%,#0003 100%),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200&q=85&fit=crop') center 42%/cover}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#111a31aa 0%,transparent 65%),linear-gradient(0deg,#0b111c 0%,transparent 65%)}
.hero>div,.hero>h2{position:relative;z-index:1}
.hero h2{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.2px;font-size:42px;line-height:.94;max-width:300px;margin:7px 0 3px}
.hero .tag{font-weight:700;letter-spacing:2.4px;text-shadow:0 1px 5px #000}
.panel{background:linear-gradient(145deg,#17212e,#101722);border:1px solid #303947;box-shadow:0 8px 22px #0003;border-radius:15px;margin:13px 10px;padding:20px}
.panel h2{font-size:31px;font-weight:800;text-transform:uppercase;letter-spacing:.2px}
.panel h3{font-size:24px;font-weight:800;text-transform:uppercase}
.big{font-size:52px;font-weight:900;line-height:1.05;color:#ff9b4b}
.stat{border:1px solid #384352;background:linear-gradient(150deg,#273343,#161e2a)}
.stat h2{margin:6px 0 0;font-size:29px;color:#fff}
.bar{height:7px;background:#353b42}
.action{background:linear-gradient(130deg,#ffad54,#ed7429);box-shadow:0 4px 14px #f58a3228;border-radius:8px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:.7px}
.action.outline{background:#1b2532;box-shadow:none;color:#fff;border:1px solid #424d5b}
.tabs{background:#0a101aeb;backdrop-filter:blur(14px);border-top:1px solid #3b4148;padding-top:3px}
.tabs button{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.3px;font-weight:700;text-transform:uppercase}
.tabs button.active{color:#ffa351}
.route{background:linear-gradient(115deg,#283b4c,#171f2b);border:1px solid #394656;padding:19px 13px}
.map{height:390px;border:1px solid #59606a}
.badge{font-weight:700}
</style></head><body><div class="wrap"><header><div class="tag">⌁ MONTAGNE • TRAIL • CLAN</div><h1>Run<span>Clan</span></h1><small>Courir plus loin, ensemble.</small></header><main id="content"></main><nav class="tabs" id="nav"></nav></div><script>
const tabs=[['accueil','⌂','Accueil'],['explorer','◇','Explorer'],['classements','♜','Classements'],['clan','♧','Clan'],['profil','♙','Profil']];
const K='runclan-published-v1';let db;try{db=JSON.parse(localStorage.getItem(K))}catch{}db=db||{name:'Toi',clan:'Les Véloces',goal:100,runs:[]};let tab='accueil';const save=()=>localStorage.setItem(K,JSON.stringify(db));const km=n=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1})+' km';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const start=()=>{let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d};const weekly=()=>db.runs.filter(r=>new Date(r.date+'T12:00:00')>=start());const total=()=>weekly().reduce((a,r)=>a+Number(r.distance),0);const sum=()=>db.runs.reduce((a,r)=>a+Number(r.distance),0);
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,ico,label])=>'<button class="'+(id===tab?'active':'')+'" onclick="go(\''+id+'\')"><div style="font-size:21px">'+ico+'</div>'+label+'</button>').join('');let h='';
if(tab==='accueil'){h='<div class="hero"><div><div class="tag">LES SENTIERS NOUS RASSEMBLENT</div><h2>Chaque sommet commence par une foulée.</h2></div></div><section class="panel"><div class="row"><h2>'+esc(db.clan)+'</h2><span class="badge">CLAN LOCAL</span></div><p class="muted">Distance collective de démonstration (tes sorties uniquement)</p><div class="big">'+km(total())+'</div><div class="bar"><div style="width:'+Math.min(100,total()/Math.max(1,db.goal)*100)+'%"></div></div><p class="muted">Objectif : '+km(db.goal)+'</p><div class="stats"><div class="stat"><small>Sorties cette semaine</small><h2>'+weekly().length+'</h2></div><div class="stat"><small>Total historique</small><h2>'+km(sum())+'</h2></div></div><div class="row"><button class="action" onclick="form()">+ Ajouter une sortie</button><button class="action outline" onclick="go(\'classements\')">Classements</button></div></section>';}
if(tab==='explorer'){h='<section class="panel"><h2>Explorer les sentiers</h2><p class="muted">Carte réelle OpenStreetMap. Connexion Internet nécessaire.</p><iframe class="map" loading="lazy" title="Carte des sentiers autour de Chamonix" src="https://www.openstreetmap.org/export/embed.html?bbox=6.821%2C45.893%2C6.920%2C45.952&layer=mapnik"></iframe><p><a href="https://www.openstreetmap.org/#map=13/45.923/6.871" target="_blank" rel="noopener" style="color:#ff943b">Ouvrir la carte plein écran</a></p><h3>Idées de parcours</h3><div class="route">⛰️ Boucle du Belvédère <span class="badge">7,8 km · Exemple</span></div><div class="route">⛰️ Sentier des Crêtes <span class="badge">9,4 km · Exemple</span></div><div class="notice">Ces parcours sont illustratifs, pas des traces GPS vérifiées.</div></section>';}
if(tab==='classements'){h='<section class="panel"><h2>Classement hebdomadaire</h2><p class="muted">Du lundi au dimanche. Mode individuel, sans amis connectés pour le moment.</p><div class="row list"><div><span class="orange runner">♛</span> '+esc(db.name)+'</div><strong>'+km(total())+'</strong></div><h3>Mes sorties</h3>'+db.runs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>'<div class="row list"><div>'+esc(r.name)+'<br><small>'+esc(r.date)+' · '+Number(r.duration)+' min</small></div><div><strong>'+km(r.distance)+'</strong><br><button class="badge outline" onclick="editRun(\''+r.id+'\')">Modifier</button></div></div>').join('')+'<button class="action" onclick="form()">+ Nouvelle sortie</button></section>';}
if(tab==='clan'){h='<div class="hero" style="height:245px"><h2>Ensemble, plus haut.</h2></div><section class="panel"><h2>'+esc(db.clan)+'</h2><div class="big">'+km(total())+'</div><p class="muted">Objectif hebdomadaire : '+km(db.goal)+'</p><div class="bar"><div style="width:'+Math.min(100,total()/Math.max(1,db.goal)*100)+'%"></div></div><p class="notice">Le clan est local à cet appareil. Les invitations et les comptes partagés viendront plus tard.</p><button class="action" onclick="editClan()">Modifier le clan</button></section>';}
if(tab==='profil'){h='<section class="panel" style="text-align:center"><div style="font-size:90px;color:#f58a32">◉</div><h2>'+esc(db.name)+'</h2><p class="badge">TRAILEUR</p><div class="stats"><div class="stat"><small>Distance totale</small><h2>'+km(sum())+'</h2></div><div class="stat"><small>Nombre de sorties</small><h2>'+db.runs.length+'</h2></div></div><p><button class="action" onclick="editProfile()">Modifier mon profil</button></p><p><button class="action outline" onclick="form()">Ajouter une sortie</button></p></section>';}
document.getElementById('content').innerHTML='<div class="screen">'+h+'</div>';}
function go(t){tab=t;render();window.scrollTo(0,0)}
function form(id){const r=db.runs.find(x=>x.id===id)||{name:'',date:new Date().toLocaleDateString('en-CA'),distance:'',duration:''};document.getElementById('content').innerHTML='<section class="panel"><h2>'+ (id?'Modifier':'Ajouter')+' une sortie</h2><form id="runForm"><label>Nom<input name="name" maxlength="80" required value="'+esc(r.name)+'"></label><label>Date<input type="date" name="date" required value="'+esc(r.date)+'"></label><label>Distance (km)<input type="number" step="0.1" min="0.1" max="500" name="distance" required value="'+r.distance+'"></label><label>Durée (minutes)<input type="number" min="1" max="5000" name="duration" required value="'+r.duration+'"></label><div class="row"><button class="action" type="submit">Enregistrer</button><button type="button" class="action outline" onclick="render()">Annuler</button></div></form>'+(id?'<button class="action outline" onclick="deleteRun(\''+id+'\')">Supprimer la sortie</button>':'')+'</section>';document.getElementById('runForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:id||String(Date.now()),name:String(f.get('name')).trim(),date:String(f.get('date')),distance:Number(f.get('distance')),duration:Number(f.get('duration'))};if(!v.name||!v.date||v.distance<=0||v.duration<=0)return;if(id)db.runs=db.runs.map(x=>x.id===id?v:x);else db.runs.push(v);save();render()}}
function editRun(id){form(id)}function deleteRun(id){if(confirm('Supprimer cette sortie ?')){db.runs=db.runs.filter(x=>x.id!==id);save();render()}}
function editProfile(){const n=prompt('Ton pseudo',db.name);if(n&&n.trim()){db.name=n.trim().slice(0,50);save();render()}}
function editClan(){const n=prompt('Nom du clan',db.clan);if(n===null)return;const g=prompt('Objectif hebdomadaire (km)',db.goal);if(g===null)return;const v=Number(g);if(n.trim()&&v>0&&v<=100000){db.clan=n.trim().slice(0,60);db.goal=v;save();render()}}
render();</script></body></html>
