background:#302114;padding:10px;border-radius:8px}.screen{padding:6px 10px}h2{margin:10px 0}h3{margin:12px 0}.runner{font-size:23px}.route{padding:12px;background:#1c2530;border-radius:10px;margin:10px 0}.badge{color:#ff943b;font-size:12px}

/* RunClan visual restoration — cinematic mountain identity */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

/* Faithful RunClan layout pass — reference five-screen illustrated concept */
body{background:#070b13;color:#f6f1eb;font-family:'DM Sans',system-ui,sans-serif}
.wrap{background:radial-gradient(ellipse at 30% 10%,#202b3c,#0a0f19 60%);box-shadow:0 0 90px #000b}
header{position:relative;background:#0b101a;border:0;padding:23px 23px 18px;text-align:center}
header .tag{display:none}

.hero-art{position:absolute;inset:0;z-index:0}

.panel{background:#0e141e;border:1px solid #313642;box-shadow:none;margin:10px 12px;border-radius:13px}

</style></head><body><div class="wrap"><header><div class="tag">TRAIL RUNNING CLUB</div><h1><span class="mountain-mark">⌁</span>Run<span>Clan</span></h1><small>Courir plus loin, ensemble.</small></header><main id="content"></main><nav class="tabs" id="nav"></nav></div><script>
const tabs=[['accueil','⌂','Accueil'],['explorer','◇','Explorer'],['classements','♜','Classements'],['clan','♧','Clan'],['profil','♙','Profil']];
const K='runclan-published-v1';let db;try{db=JSON.parse(localStorage.getItem(K))}catch{}db=db||{name:'Toi',clan:'Les Véloces',goal:100,runs:[]};let tab='accueil';const save=()=>localStorage.setItem(K,JSON.stringify(db));const km=n=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1})+' km';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const start=()=>{let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d};const weekly=()=>db.runs.filter(r=>new Date(r.date+'T12:00:00')>=start());const total=()=>weekly().reduce((a,r)=>a+Number(r.distance),0);const sum=()=>db.runs.reduce((a,r)=>a+Number(r.distance),0);
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,ico,label])=>'<button class="'+(id===tab?'active':'')+'" onclick="go(\''+id+'\')"><div style="font-size:21px">'+ico+'</div>'+label+'</button>').join('');let h='';
if(tab==='accueil'){h='<div class="hero"><div class="hero-art"><div class="mountain-range"></div><div class="runners">🏃🏻‍♀️　🏃🏽　🏃🏻</div></div><div class="hero-copy"><h2>Courir plus loin,<br><span class="orange">ensemble.</span></h2></div></div><section class="panel"><div class="row clan-name"><div class="wolf">♜</div><div style="flex:1"><h2>'+esc(db.clan)+'</h2><small>Notre clan</small></div><span class="badge">›</span></div><p class="muted">Distance cette semaine</p><div class="big">'+km(total())+'</div><div class="bar"><div style="width:'+Math.min(100,total()/Math.max(1,db.goal)*100)+'%"></div></div><p class="muted">Objectif : '+km(db.goal)+'</p><div class="stats"><div class="stat"><small>Sorties cette semaine</small><h2>'+weekly().length+'</h2></div><div class="stat"><small>Total historique</small><h2>'+km(sum())+'</h2></div></div><div class="row"><button class="action" onclick="form()">+ Ajouter une sortie</button><button class="action outline" onclick="go(\'classements\')">Classements</button></div></section>';}
if(tab==='explorer'){h='<div class="explore-banner"><h2>Explorer</h2><div class="segmented"><span class="selected">Carte</span><span>Sorties</span></div></div><section class="panel"><h2>Explorer les sentiers</h2><p class="muted">Carte réelle OpenStreetMap. Connexion Internet nécessaire.</p><iframe class="map" loading="lazy" title="Carte des sentiers autour de Chamonix" src="https://www.openstreetmap.org/export/embed.html?bbox=6.821%2C45.893%2C6.920%2C45.952&layer=mapnik"></iframe><p><a href="https://www.openstreetmap.org/#map=13/45.923/6.871" target="_blank" rel="noopener" style="color:#ff943b">Ouvrir la carte plein écran</a></p><h3>Idées de parcours</h3><div class="route">⛰️ Boucle du Belvédère <span class="badge">7,8 km · Exemple</span></div><div class="route">⛰️ Sentier des Crêtes <span class="badge">9,4 km · Exemple</span></div><div class="notice">Ces parcours sont illustratifs, pas des traces GPS vérifiées.</div></section>';}
if(tab==='classements'){h='<div class="rank-banner"><h2>Classements</h2><div class="segmented"><span class="selected">Individuel</span><span>Clans</span></div></div><section class="panel"><h2>Classement hebdomadaire</h2><p class="muted">Du lundi au dimanche. Mode individuel, sans amis connectés pour le moment.</p><div class="row list"><div><span class="orange runner">♛</span> '+esc(db.name)+'</div><strong>'+km(total())+'</strong></div><h3>Mes sorties</h3>'+db.runs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>'<div class="row list"><div>'+esc(r.name)+'<br><small>'+esc(r.date)+' · '+Number(r.duration)+' min</small></div><div><strong>'+km(r.distance)+'</strong><br><button class="badge outline" onclick="editRun(\''+r.id+'\')">Modifier</button></div></div>').join('')+'<button class="action" onclick="form()">+ Nouvelle sortie</button></section>';}
if(tab==='clan'){h='<div class="hero clan-hero" style="height:270px"><div class="hero-art"><div class="mountain-range"></div><div class="runners">🏃🏻　🏃🏽‍♀️　🏃🏻‍♀️</div></div><div class="hero-copy"><h2>Mon Clan</h2></div></div><section class="panel"><h2>'+esc(db.clan)+'</h2><div class="big">'+km(total())+'</div><p class="muted">Objectif hebdomadaire : '+km(db.goal)+'</p><div class="bar"><div style="width:'+Math.min(100,total()/Math.max(1,db.goal)*100)+'%"></div></div><p class="notice">Le clan est local à cet appareil. Les invitations et les comptes partagés viendront plus tard.</p><button class="action" onclick="editClan()">Modifier le clan</button></section>';}
if(tab==='profil'){h='<div class="profile-banner"><h2>Profil</h2></div><section class="panel" style="text-align:center"><div class="avatar-mark"><span>◉</span></div><h2>'+esc(db.name)+'</h2><p class="badge">TRAILEUR</p><div class="stats"><div class="stat"><small>Distance totale</small><h2>'+km(sum())+'</h2></div><div class="stat"><small>Nombre de sorties</small><h2>'+db.runs.length+'</h2></div></div><p><button class="action" onclick="editProfile()">Modifier mon profil</button></p><p><button class="action outline" onclick="form()">Ajouter une sortie</button></p></section>';}
document.getElementById('content').innerHTML='<div class="screen">'+h+'</div>';}
function go(t){tab=t;render();window.scrollTo(0,0)}
function form(id){const r=db.runs.find(x=>x.id===id)||{name:'',date:new Date().toLocaleDateString('en-CA'),distance:'',duration:''};document.getElementById('content').innerHTML='<section class="panel"><h2>'+ (id?'Modifier':'Ajouter')+' une sortie</h2><form id="runForm"><label>Nom<input name="name" maxlength="80" required value="'+esc(r.name)+'"></label><label>Date<input type="date" name="date" required value="'+esc(r.date)+'"></label><label>Distance (km)<input type="number" step="0.1" min="0.1" max="500" name="distance" required value="'+r.distance+'"></label><label>Durée (minutes)<input type="number" min="1" max="5000" name="duration" required value="'+r.duration+'"></label><div class="row"><button class="action" type="submit">Enregistrer</button><button type="button" class="action outline" onclick="render()">Annuler</button></div></form>'+(id?'<button class="action outline" onclick="deleteRun(\''+id+'\')">Supprimer la sortie</button>':'')+'</section>';document.getElementById('runForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:id||String(Date.now()),name:String(f.get('name')).trim(),date:String(f.get('date')),distance:Number(f.get('distance')),duration:Number(f.get('duration'))};if(!v.name||!v.date||v.distance<=0||v.duration<=0)return;if(id)db.runs=db.runs.map(x=>x.id===id?v:x);else db.runs.push(v);save();render()}}
function editRun(id){form(id)}function deleteRun(id){if(confirm('Supprimer cette sortie ?')){db.runs=db.runs.filter(x=>x.id!==id);save();render()}}
function editProfile(){const n=prompt('Ton pseudo',db.name);if(n&&n.trim()){db.name=n.trim().slice(0,50);save();render()}}
function editClan(){const n=prompt('Nom du clan',db.clan);if(n===null)return;const g=prompt('Objectif hebdomadaire (km)',db.goal);if(g===null)return;const v=Number(g);if(n.trim()&&v>0&&v<=100000){db.clan=n.trim().slice(0,60);db.goal=v;save();render()}}
render();</script></body></html>
