<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#0b0f17"><meta name="apple-mobile-web-app-capable" content="yes"><title>RunClan — Maquette originale</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070b12;color:#f6f0eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#070b12}.mock{position:absolute;inset:0;background-image:url('https://raw.githubusercontent.com/louiscompan12-del/runclan/main/6EE2058C-80BE-4529-9C40-5B8506E1247A.png');background-repeat:no-repeat;background-size:500% 100%;background-position:0% center;transition:background-position .16s ease}.mock:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#070b1210,transparent 10%,transparent 90%,#070b1210)}
.nav{position:absolute;left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom) + 5%);height:8%;display:flex;z-index:2}.nav button{width:20%;border:0;background:transparent;color:transparent}.nav button:focus-visible{outline:2px solid #f38b40}
.hotspot{position:absolute;z-index:2;background:transparent;border:0;color:transparent}.primary{left:7%;right:7%;top:56%;height:12%}
.fab{position:absolute;right:6%;bottom:calc(env(safe-area-inset-bottom) + 14%);z-index:3;background:#ef8a42;color:#141016;border:1px solid #ffc087;border-radius:50%;width:47px;height:47px;font-size:24px;box-shadow:0 5px 15px #000b}
.sheet{position:absolute;inset:0;z-index:10;background:#070b12f2;overflow:auto;padding:calc(env(safe-area-inset-top) + 22px) 19px calc(env(safe-area-inset-bottom) + 30px);display:none}.sheet.open{display:block}.sheet h2{font-size:26px;margin:0 0 14px;font-weight:800}.sheet h3{font-size:18px}.sheet p{color:#c3c0c0;line-height:1.5}.sheet .close{float:right;background:#25303c;color:#fff;border:1px solid #45515c;border-radius:9px;padding:9px 13px}.sheet .cta{background:#ed8b43;color:#0c1118;border:0;border-radius:8px;font-weight:800;padding:13px 17px}.sheet input{display:block;width:100%;padding:12px;margin:7px 0 15px;background:#111c29;border:1px solid #435061;border-radius:8px;color:#fff}.sheet label{display:block;color:#d5d3d2}.sheet .card{padding:14px;background:#17212e;border:1px solid #3d4654;border-radius:12px;margin:12px 0}.sheet .map{width:100%;height:56dvh;border:1px solid #414b56;border-radius:12px}.sheet a{color:#ff9d55}.hint{font-size:12px;color:#e6c3a5!important}.notice{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:10%;right:10%;z-index:4;background:#101a25ee;color:#f8bd8d;text-align:center;padding:8px;border-radius:8px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .3s}.notice.show{opacity:1}
@media(min-width:521px){.app{box-shadow:0 0 80px #000;border-left:1px solid #38414a;border-right:1px solid #38414a}}
</style></head><body><div class="app"><div class="mock" id="mock" role="img" aria-label="Maquette RunClan originale"></div><div class="notice" id="notice"></div><div class="nav" aria-label="Navigation"><button aria-label="Accueil" onclick="go(0)">Accueil</button><button aria-label="Explorer" onclick="go(1)">Explorer</button><button aria-label="Classements" onclick="go(2)">Classements</button><button aria-label="Clan" onclick="go(3)">Clan</button><button aria-label="Profil" onclick="go(4)">Profil</button></div><button class="fab" aria-label="Ajouter une sortie" onclick="show('run')">+</button><button class="hotspot primary" id="detail" aria-label="Afficher les détails" onclick="detail()"></button><section class="sheet" id="sheet"><button class="close" onclick="hide()">Fermer ✕</button><div id="sheetContent"></div></section></div><script>
const mock=document.getElementById('mock'),sheet=document.getElementById('sheet'),content=document.getElementById('sheetContent');let page=0;
const K='runclan-maquette-data-v1';let data;try{data=JSON.parse(localStorage.getItem(K))}catch{}data=data||{name:'Toi',clan:'Les Véloces',runs:[]};const save=()=>localStorage.setItem(K,JSON.stringify(data));const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=()=>data.runs.reduce((a,r)=>a+Number(r.distance),0);const labels=['Accueil','Classements','Explorer','Mon Clan','Profil'];const positions=[0,25,50,75,100];
function go(i){page=i;mock.style.backgroundPosition=positions[i]+'% center';document.getElementById('detail').setAttribute('aria-label','Détails '+labels[i]);}
function show(mode){sheet.classList.add('open');let html='';
if(mode==='run'){html='<h2>Ajouter une sortie</h2><p>Les sorties enregistrées ici sont réelles et restent sur cet iPhone. Les chiffres de la maquette restent illustratifs.</p><form id="runform"><label>Nom de la sortie<input name="name" required maxlength="80" placeholder="Sortie du dimanche"></label><label>Date<input type="date" name="date" required value="'+new Date().toLocaleDateString('en-CA')+'"></label><label>Distance en km<input type="number" name="distance" min="0.1" max="500" step="0.1" required></label><label>Durée en minutes<input type="number" name="duration" min="1" max="5000" required></label><button class="cta" type="submit">Enregistrer</button></form>'; }
else if(mode==='map'){html='<h2>Carte réelle</h2><p>Déplace la carte, zoome et explore les sentiers autour de Chamonix.</p><iframe class="map" title="Carte OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=6.82%2C45.89%2C6.92%2C45.95&layer=mapnik"></iframe><p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=13/45.923/6.871">Ouvrir dans OpenStreetMap</a></p><p class="hint">La trace orange visible sur la maquette est une illustration, pas un parcours GPS.</p>';}
else if(mode==='stats'){html='<h2>Mes vraies statistiques</h2><div class="card"><h3>'+total().toLocaleString('fr-FR',{maximumFractionDigits:1})+' km</h3><p>'+data.runs.length+' sorties enregistrées sur cet appareil</p></div>'+data.runs.slice().reverse().map(r=>'<div class="card"><strong>'+esc(r.name)+'</strong><p>'+esc(r.date)+' — '+r.distance+' km · '+r.duration+' min</p></div>').join('')+'<button class="cta" onclick="show(\'run\')">Ajouter une sortie</button>';}
else if(mode==='profile'){html='<h2>Mon profil</h2><label>Mon pseudo<input id="nickname" maxlength="50" value="'+esc(data.name)+'"></label><label>Nom du clan<input id="clanname" maxlength="50" value="'+esc(data.clan)+'"></label><button class="cta" onclick="saveProfile()">Enregistrer</button><p class="hint">Les avatars et les classements affichés sur la maquette sont des exemples.</p>';}
else{html='<h2>'+labels[page]+'</h2><p>Tu regardes la maquette originale. Les personnages, membres, classements et distances affichés sont illustratifs.</p><button class="cta" onclick="show(\'stats\')">Voir mes vraies statistiques</button>';}
content.innerHTML=html;if(mode==='run'){document.getElementById('runform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={name:String(f.get('name')).trim(),date:String(f.get('date')),distance:Number(f.get('distance')),duration:Number(f.get('duration'))};if(!r.name||r.distance<=0||r.duration<=0)return;data.runs.push(r);save();show('stats')}}}
function hide(){sheet.classList.remove('open')}function detail(){show(page===2?'map':page===4?'profile':'stats')}function saveProfile(){data.name=document.getElementById('nickname').value.trim()||'Toi';data.clan=document.getElementById('clanname').value.trim()||'Les Véloces';save();hide()}
go(0);
</script></body></html>
